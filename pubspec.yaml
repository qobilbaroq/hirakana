name: kana_quest
description: "Aplikasi belajar Hiragana & Katakana, offline-first. Multi-platform: Android, Linux, Windows, macOS, iOS, Web."
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  # sqflite hanya jalan di Android/iOS. Untuk Linux, Windows, macOS dipakai
  # sqflite_common_ffi, dan untuk Web dipakai sqflite_common_ffi_web.
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.0
  path_provider: ^2.1.6
  audioplayers: ^6.1.0
  path_drawing: ^1.0.1
  http: ^1.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/slow/
    - assets/audio/words/
    - assets/data/
    - assets/strokes/

# Ikon aplikasi: jalankan `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#82947A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"

# Splash screen: jalankan `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F7F5EF"
  image: assets/icon/splash.png
  color_dark: "#000000"
  image_dark: assets/icon/splash_dark.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#F7F5EF"
    image: assets/icon/splash.png
    icon_background_color: "#F7F5EF"
    color_dark: "#000000"
    image_dark: assets/icon/splash_dark.png
    icon_background_color_dark: "#000000"